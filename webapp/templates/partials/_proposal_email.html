{% import '_macros.html' as ui %}
<section class="panel" id="email"{% if output_oob is defined and output_oob %} hx-swap-oob="true"{% endif %}>
  <div class="panel__head"><div class="panel__title">Covering email</div></div>
  <div class="panel__body">
    <div class="field">
      <label class="label label--sm" for="email-subject">Subject</label>
      <input class="input" id="email-subject" value="{{ email_subject }}" readonly>
    </div>
    <div class="field">
      <label class="label label--sm" for="email-body">Message</label>
      <textarea class="textarea" id="email-body" rows="12" readonly>{{ email_body }}</textarea>
    </div>
    {# app.js answers on the button itself ("Copied"), because a copy that wrote
       nothing and a copy that worked looked exactly the same before. #}
    <div class="row" style="gap:8px; flex-wrap:wrap;">
      <button type="button" class="btn btn--ghost btn--sm" data-copy="email-subject">{{ ui.icon('mail', 'icon--sm') }}<span>Copy subject</span></button>
      <button type="button" class="btn btn--ghost btn--sm" data-copy="email-body">{{ ui.icon('mail', 'icon--sm') }}<span>Copy message</span></button>
    </div>
    <div class="hint mt-1">Attach the PDF you saved from the Word file. Updated when you save.</div>
  </div>
</section>
