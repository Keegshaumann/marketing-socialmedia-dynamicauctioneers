# nginx reverse proxy for the marketing platform at its main address.
# Place at /etc/nginx/sites-available/da-studio and symlink into sites-enabled/.
# BASE http config: `certbot --nginx -d studio.dynamicauctioneers.co.za --redirect`
# adds the 443 / ssl_certificate lines and the http->https redirect.
# Same app and database as 46.202.175.127.nip.io (nginx-da-marketing.conf).
# DNS: A record `studio` -> 46.202.175.127 at Xneelo (dynamicauctioneers.co.za).
server {
    listen 80;
    listen [::]:80;
    server_name studio.dynamicauctioneers.co.za;

    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location = /login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A whole set (ads, board, info pack) is built on one request. No trailing
    # slash: see the note in nginx-da-marketing.conf (redirect loop on /studio).
    location /studio {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
