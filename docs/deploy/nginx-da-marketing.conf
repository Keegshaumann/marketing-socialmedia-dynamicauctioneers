# nginx reverse proxy for the marketing platform at its original address.
# Place at /etc/nginx/sites-available/da-marketing and symlink into
# sites-enabled/ (remove the default site). This is the BASE http config;
# `certbot --nginx` adds the listen 443 / ssl_certificate lines and the
# http->https redirect automatically, so do not hand-edit those in.
# The main address is studio.dynamicauctioneers.co.za (nginx-da-studio.conf);
# this one stays for existing bookmarks. `zone=login` is defined in
# /etc/nginx/conf.d/da-ratelimit.conf:
#   limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 46.202.175.127.nip.io;

    client_max_body_size 50M;             # uploads of multi-MB PDFs

    location = /login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Ad Studio builds a whole set (ads, board, info pack) on one request.
    # No trailing slash on purpose: "location /studio/ { proxy_pass ... }" makes
    # nginx answer /studio with a 301 to /studio/, which the app sends straight
    # back to /studio, a redirect loop on the page marketers land on.
    location /studio {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
