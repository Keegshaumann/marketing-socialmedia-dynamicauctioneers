# nginx reverse proxy for the marketing platform.
# Place at /etc/nginx/sites-available/da-marketing and symlink into
# sites-enabled/ (remove the default site). This is the BASE http config;
# `certbot --nginx` adds the listen 443 / ssl_certificate lines and the
# http->https redirect automatically, so do not hand-edit those in.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 46.202.175.127.nip.io;   # swap for the real subdomain later

    client_max_body_size 50M;             # intake uploads multi-MB PDFs

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
