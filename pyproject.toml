[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-engine"
version = "0.1.0"
description = "Property-marketing automation engine for Dynamic Auctioneers (Phase 1: ingest)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2",
    "PyMuPDF>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
engine = "engine.cli:main"

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
